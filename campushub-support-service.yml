# Fichier: campushub-cloud-config/campushub-support-service.yml

# --- Configuration de la base de données MySQL ---
# Le service Python lira cette valeur pour sa connexion à la DB.
# Notez que 'campushub-support-db' est le nom du service MySQL dans votre docker-compose.
DATABASE_URL: "mysql+mysqlclient://root:root@campushub-support-db/campushub_supports"

# --- Configuration du serveur Eureka ---
# L'URL du serveur Eureka où le service Python doit s'enregistrer.
# Notez que 'campushub-registry' est le nom du service Eureka dans votre docker-compose.
EUREKA_SERVER_URL: "http://campushub-registry:8761/eureka/"

# --- Configuration du répertoire d'upload (optionnel) ---
# Si vous souhaitez une valeur différente du défaut "uploaded_files", ou un chemin absolu dans le conteneur.
# UPLOAD_DIRECTORY: "/app/uploaded_files"

# --- Autres paramètres d'application ---
# Vous pouvez ajouter ici d'autres clés/valeurs qui seront chargées par le service Python.
# Par exemple:
# app_version: "1.0.0"
# some_feature_toggle: true
