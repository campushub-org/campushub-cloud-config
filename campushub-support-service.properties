# DataSource settings
service.port=8083
spring.datasource.url=jdbc:mysql://campushub-support-db:3306/campushub_supports?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Eureka Client settings
eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
