# DataSource settings
spring.datasource.url=jdbc:mysql://campushub-support-db:3306/campushub_supports?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Eureka Client settings
eureka.client.enabled=true
eureka.client.serviceUrl.defaultZone=http://campushub-registry:8761/eureka

# RabbitMQ settings
# These would be configured here if different from defaults
# spring.rabbitmq.host=rabbitmq
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=guest
# spring.rabbitmq.password=guest
