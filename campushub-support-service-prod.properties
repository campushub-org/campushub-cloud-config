server.port=8083

eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka/

spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:3306/supports_db?useSSL=false&serverTimeZone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.devtools.jmx.enabled=false
jwt.secret=${JWT_SECRET}

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}
