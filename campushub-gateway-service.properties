server.port=8080
eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.cloud.gateway.discovery.locator.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=lb://campushub-user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/campushub-user-service/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/campushub-user-service/(?<remaining>.*), /${remaining}