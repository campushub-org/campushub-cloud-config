server.port=8080
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=salle-service
spring.cloud.gateway.routes[0].uri=lb://salle-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/salle/**
spring.cloud.gateway.routes[0].filters[0]=AddRequestHeader=X-Gateway,Gateway

# Actuator settings
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
