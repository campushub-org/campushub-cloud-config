server.port=8081

eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka/

spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:3306/user_db?useSSL=false&serverTimeZone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.devtools.jmx.enabled=false
jwt.secret=${JWT_SECRET}
