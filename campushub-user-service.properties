server.port=8081

eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:mysql://campushub-user-db:3306/campushub_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimeZone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.devtools.jmx.enabled=false
