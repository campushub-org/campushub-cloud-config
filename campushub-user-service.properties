spring.application.name=campushub-user-service
server.port=8081
eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.datasource.url=jdbc:mysql://mysql:3306/campushub_user_db?createDatabaseIfNotExist=true
spring.datasource.username=usercampushub
spring.datasource.password=YES
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true