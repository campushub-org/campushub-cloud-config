server.port=3000
spring.application.name=campushub-notification-service

eureka.client.service-url.defaultZone=http://campushub-registry:8761/eureka/

spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:3306/notification_db?useSSL=false&serverTimeZone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}
